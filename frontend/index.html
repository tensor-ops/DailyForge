<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No-flash theme initializer: must run before any CSS renders -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('df-theme') || 'dark';
          var accent = localStorage.getItem('df-accent') || 'midnight';
          var themeName = localStorage.getItem('df-theme-name') || (theme === 'light' ? 'forge-light' : 'forge-dark');
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.add(isDark ? 'dark' : 'light');
          root.classList.add('accent-' + accent);
          root.classList.add('theme-' + themeName);
        } catch(e) {
          document.documentElement.classList.add('dark', 'accent-midnight', 'theme-forge-dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logos/daily-forge-icon-forge-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DailyForge</title>
    <meta name="description" content="Build better habits, understand your progress, and create routines that last." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DailyForge" />
    <meta property="og:description" content="Build better habits, understand your progress, and create routines that last." />
    
    <!-- Google Fonts Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
